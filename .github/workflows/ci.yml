name: CI & Publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install axiom-math with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run pytest suite
        run: python -m pytest -v
      - name: Run adversarial soundness tests (no mocks in critical path)
        run: python -m pytest tests/test_adversarial.py -v
      - name: Run AXIOM doctor self-test
        run: python -m axiom.cli doctor
      - name: Run verification benchmarks
        run: python benchmarks/run_benchmarks.py
      - name: Run Millennium Research Bench
        run: python benchmarks/millennium/run_millennium_bench.py
      - name: Upload Millennium Scorecard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: millennium-scorecard-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmarks/millennium/scorecard.json

  formal-lean:
    runs-on: ubuntu-latest
    env:
      AXIOM_REQUIRE_LEAN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Lean 4 toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-lean4-v4.14.0-${{ runner.os }}
      - name: Install elan and Lean 4 toolchain
        run: |
          if [ ! -x "$HOME/.elan/bin/lean" ]; then
            # Ref pinnada a commit SHA (imutavel) em vez da branch mutavel master
            curl https://raw.githubusercontent.com/leanprover/elan/9605b24b08cf68b78dce0014b6fa01be1f8e2cee/elan-init.sh -sSf | sh -s -- -y --default-toolchain leanprover/lean4:v4.14.0
          fi
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          $HOME/.elan/bin/elan default leanprover/lean4:v4.14.0
          $HOME/.elan/bin/lean --version
          $HOME/.elan/bin/lake --version
      - name: Install axiom-math with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run Lean 4 + Lake formal proof integration suite
        run: python -m pytest -v -k "lean"

  build-dist:
    needs: [test, formal-lean]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
