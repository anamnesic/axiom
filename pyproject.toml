[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "axiom-math"
version = "0.2.7"
description = "AXIOM — Mathematical Reasoning Engine. One MCP for mathematical computation, exploration, and verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "chronokairo" }]
keywords = ["mcp", "mathematics", "sympy", "computer-algebra", "verification", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
  "sympy>=1.12",
  "mpmath>=1.3",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
axiom = "axiom.cli:main"
math = "axiom.cli:main"
axiom-mcp = "axiom.mcp_server:main"

[project.urls]
Homepage = "https://github.com/chronokairo/axiom"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
